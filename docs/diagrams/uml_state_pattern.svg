<text x="791.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">OrderState refuses every action by default:</text>
<text x="791.0" y="117.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">&quot;A shipped order cannot be cancelled.&quot; (HTTP 409)</text>
<text x="791.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Each concrete state overrides only the actions</text>
<text x="791.0" y="151.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">it allows, then calls move_to() on the context.</text>
<text x="791.0" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"></text>
<text x="791.0" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">move_to() records the history and publishes an</text>
<text x="791.0" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">event for the Observer pattern.</text>
