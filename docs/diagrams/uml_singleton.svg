<path d="M700 70 H986 L1000 84 V239 H700 Z" fill="#fffbea" stroke="#d6b656" stroke-width="1.2"/>
<path d="M986 70 V84 H1000" fill="none" stroke="#d6b656" stroke-width="1.2"/>
<text x="710.0" y="90.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">The first call creates the object.</text>
<text x="710.0" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Every later call returns that same one:</text>
<text x="710.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"></text>
<text x="710.0" y="141.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Settings() is Settings()        → True</text>
<text x="710.0" y="158.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">DatabaseManager().engine is</text>
<text x="710.0" y="175.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">    DatabaseManager().engine    → True</text>
<text x="710.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal"></text>
<text x="710.0" y="209.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">A re-entrant lock makes creation</text>
<text x="710.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">safe when requests arrive together.</text>
