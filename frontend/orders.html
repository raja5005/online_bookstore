<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your orders | Online Bookstore</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/orders.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <h1 class="page-title">Your orders</h1>
    <p id="status" class="status" role="status">Loading your orders…</p>
    <div id="orders" class="table-wrap" hidden>
      <table>
        <thead>
          <tr>
            <th scope="col">Order</th>
            <th scope="col">Placed</th>
            <th scope="col" class="numeric">Items</th>
            <th scope="col" class="numeric">Total</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <nav id="pager" class="pager" aria-label="Pages"></nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
