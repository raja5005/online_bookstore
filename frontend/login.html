<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Online Bookstore</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page page-narrow">
    <div class="panel">
      <div class="tabs" role="tablist">
        <button id="tab-login" class="tab" role="tab" type="button" aria-selected="true" aria-controls="login-form">Log in</button>
        <button id="tab-register" class="tab" role="tab" type="button" aria-selected="false" aria-controls="register-form">Create account</button>
      </div>
      <p id="form-error" class="form-error" role="alert" hidden></p>

      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button wide" type="submit">Log in</button>
      </form>

      <form id="register-form" hidden>
        <div class="field">
          <label for="register-name">Full name</label>
          <input id="register-name" autocomplete="name" maxlength="120" required>
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input id="register-email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="register-password">Password</label>
          <input id="register-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          <p class="hint">At least 8 characters.</p>
        </div>
        <button class="button wide" type="submit">Create account</button>
      </form>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
