<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications | Online Bookstore</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/notifications.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page page-medium">
    <div class="admin-head">
      <h1>Notifications</h1>
      <button id="mark-all" class="button button-quiet" type="button" hidden>Mark all as read</button>
    </div>
    <p id="status" class="status" role="status">Loading…</p>
    <ul id="list" class="notification-list"></ul>
    <nav id="pager" class="pager" aria-label="Pages"></nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
